name: Cadde Depo RPC v3 isolated integration
on:
  pull_request:
    paths:
      - 'release/production/**'
      - 'release/preview/**'
      - 'index.html'
      - 'urun.html'
      - 'preview-checkout-v3-test.html'
      - 'api/cadde-preview-checkout-v3.js'
      - '.github/workflows/rpc-v3-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-pg17-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cadde_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cadde_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: cadde_ci
      PGPASSWORD: local-ci-only-not-production
      CADDE_CI_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build synthetic schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f release/production/tests/isolated_pg16_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/10_EXPAND_SCHEMA_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/15_TRUSTED_ORDER_PROVENANCE_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/25_CHECKOUT_RPC_V3_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/30_ADMIN_RPC_REVIEW_ONLY.sql
      - name: PostgreSQL 17 synthetic backup restore validation
        run: bash release/production/tests/pg17_synthetic_restore_ci.sh
  isolated-postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadde_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cadde_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: cadde_ci
      PGPASSWORD: local-ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - name: Verify disabled Preview v3 checkout gateway contract
        run: node release/production/tests/preview_gateway_contract.cjs
      - name: Check Preview storefront production data isolation
        run: node release/production/tests/preview_source_isolation.cjs
      - name: Verify real Cloudflare Siteverify using official test keys
        env:
          CADDE_CI_ISOLATED: '1'
          CADDE_REAL_TURNSTILE_TEST: '1'
        run: node release/production/tests/turnstile_real_siteverify_dummy_ci.cjs
      - name: Run production candidate HTTP mock contracts
        run: node release/production/tests/gateway-http-contract.cjs
      - name: Check Preview admin audited RPC UI security contract
        run: node release/production/tests/preview_admin_ui_contract.cjs
      - name: Check SQL static contracts
        run: node release/production/tests/check_v3_static.cjs
      - name: Set up isolated fixture and candidate RPCs
        run: |
          psql -X -v ON_ERROR_STOP=1 -f release/production/tests/isolated_pg16_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/10_EXPAND_SCHEMA_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/15_TRUSTED_ORDER_PROVENANCE_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/25_CHECKOUT_RPC_V3_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/30_ADMIN_RPC_REVIEW_ONLY.sql
      - name: Apply review-only classification candidate in disposable PostgreSQL 16
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/32_ORDER_CLASSIFICATION_REVIEW_ONLY.sql
      - name: Run isolated order classification AAL2 audit and reporting contract (rollback-only)
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/tests/order_classification_isolated_contract.sql
      - name: Run full rollback-only integration assertions
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/tests/isolated_pg16_integration.sql
      - name: Check adversarial admin AAL2 and legacy stock isolation (rollback-only)
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/tests/admin_aal2_adversarial_contract.sql
      - name: Check legacy write access revoked while protected RPC remains available
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/tests/cutover_role_policy_rollback.sql
      - name: Test safe cutover and unsafe reversal in rollback-only transaction
        run: psql -X -v ON_ERROR_STOP=1 -f release/production/tests/cutover_and_reversal_contract.sql
      - name: Verify simultaneous independent PostgreSQL connections
        run: node release/production/tests/concurrent_pg16_rpc.cjs
      - name: T3 concurrent AAL2 approvals of the final synthetic stock unit
        env:
          CADDE_CI_ISOLATED: '1'
        run: node release/production/tests/concurrent_admin_stock_pg16.cjs
      - name: Run localhost HTTP to real PostgreSQL v3 integration
        env:
          CADDE_CI_ISOLATED: '1'
        run: node release/production/tests/local_http_pg16_integration.cjs

      - name: Start isolated PostgREST RPC HTTP services
        run: |
          docker run -d --name cadde-postgrest-v3 --network host \
            -e PGRST_DB_URI=postgres://postgres:local-ci-only-not-production@127.0.0.1:5432/cadde_ci \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=service_role \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.8
          docker run -d --name cadde-postgrest-anon --network host \
            -e PGRST_DB_URI=postgres://postgres:local-ci-only-not-production@127.0.0.1:5432/cadde_ci \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3002 \
            postgrest/postgrest:v12.2.8
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null && curl -fsS http://127.0.0.1:3002/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs cadde-postgrest-v3
          exit 1
      - name: Real PostgREST HTTP and PostgreSQL RPC v3 security checks
        env:
          CADDE_CI_ISOLATED: '1'
        run: node release/production/tests/real_postgrest_rpc_v3.cjs
      - name: Verify synthetic PostgreSQL dump and restore
        env:
          CADDE_CI_ISOLATED: '1'
        run: node release/production/tests/synthetic_backup_restore_ci.cjs
      - name: Verify admin AAL2 product RLS on isolated PostgreSQL 16
        run: |
          psql -X -v ON_ERROR_STOP=1 -f release/production/tests/preview_products_aal2_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f release/preview/preview_admin_products_aal2_20261025.sql
          psql -X -v ON_ERROR_STOP=1 -f release/production/tests/preview_products_aal2_assertions.sql
