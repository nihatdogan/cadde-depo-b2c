name: PR3 Preview Safety (read-only)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'urun.html'
      - 'admin-gorsel.html'
      - 'yakinda-gelecek.js'
      - 'admin-upcoming.js'
      - 'api/admin/upload-product-image.js'
      - 'supabase/pr3-upcoming-catalog-preview.sql'
      - 'tests/pr3-safety.test.mjs'
      - '.github/workflows/pr3-preview-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/pr3-safety.test.mjs
